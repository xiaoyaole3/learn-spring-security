<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
</head>
<body>
<h2>登录</h2>

<p th:if="${param.error}" style="color:red;">用户名或密码错误</p>
<p th:if="${param.logout}" style="color:green;">已退出登录</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autofocus>
    </div>
    <div>
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required>
    </div>
    <div>
        <label>
            <input type="checkbox" name="remember-me"> 记住我
        </label>
    </div>

    <div class="login-item">
        <label for="captchaCode">验证码</label>
        <input type="text" id="captchaCode" name="captchaCode" required placeholder="请输入验证码" style="width: 120px">
        <img id="captchaImg" src="/captcha/get" title="点击刷新验证码" onclick="refreshCaptcha()">
    </div>

    <button type="submit">登录</button>
</form>
</body>

<script>
    // 刷新验证码
    function refreshCaptcha() {
        let captcha = document.getElementById('captchaCode');
        // 加载时间戳参数，防止缓存导致图片不刷新
        captcha.src = '/captcha/get?timestamp=' + new Date().getTime();
    }
</script>
</html>
