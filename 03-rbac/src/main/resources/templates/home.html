<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .home-container {
            width: 100%;
            max-width: 440px;
            padding: 32px 30px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
        }

        .home-container h1 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
            text-align: center;
        }

        .welcome {
            margin: 0 0 24px;
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            font-size: 14px;
            color: #374151;
            border-bottom: 1px solid #f3f4f6;
        }

        .info-row:last-of-type { border-bottom: none; }

        .info-row .label { color: #9ca3af; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 999px;
        }

        .badge-normal {
            color: #047857;
            background: #d1fae5;
        }

        .badge-remember {
            color: #b45309;
            background: #fef3c7;
        }

        .role-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }

        .role {
            padding: 2px 8px;
            font-size: 12px;
            color: #4f46e5;
            background: #eef2ff;
            border-radius: 6px;
        }

        .hint {
            margin: 18px 0 0;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.6;
            color: #92400e;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
        }

        .btn-logout {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .2s, transform .15s;
        }

        .btn-logout:hover { opacity: .92; transform: translateY(-1px); }
        .btn-logout:active { transform: translateY(0); }
    </style>
</head>
<body>

<div class="home-container">
    <h1>登录成功</h1>
    <p class="welcome">欢迎回来，<span th:text="${#authentication.name}">用户</span></p>

    <!-- 当前用户 -->
    <div class="info-row">
        <span class="label">当前用户</span>
        <span th:text="${#authentication.name}">user</span>
    </div>

    <!-- 登录方式：普通登录 / remember-me -->
    <div class="info-row">
        <span class="label">登录方式</span>
        <span th:if="${#authentication instanceof T(org.springframework.security.authentication.RememberMeAuthenticationToken)}"
              class="badge badge-remember">记住我自动登录</span>
        <span th:unless="${#authentication instanceof T(org.springframework.security.authentication.RememberMeAuthenticationToken)}"
              class="badge badge-normal">账号密码登录</span>
    </div>

    <!-- 权限列表 -->
    <div class="info-row">
        <span class="label">权限</span>
        <div class="role-list">
            <span class="role"
                  th:each="authority : ${#authentication.authorities}"
                  th:text="${authority.authority}">ROLE_USER</span>
        </div>
    </div>

    <!-- 如果是 remember-me 登录，提示受保护操作需要重新登录 -->
    <p class="hint"
       th:if="${#authentication instanceof T(org.springframework.security.authentication.RememberMeAuthenticationToken)}">
        当前为「记住我」自动登录，部分敏感操作可能需要重新输入密码。
    </p>

    <!-- 退出：必须用 POST，th:action 会自动注入 CSRF token -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">退出登录</button>
    </form>
</div>

</body>
</html>
